---
name: Ansible Lint

on: [pull_request]

permissions:
  contents: read

jobs:
  blocklist-orchestration:
    name: Blocklist failure isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build disposable systemd test image
        run: docker build -f tests/Dockerfile.blocklists -t rpi-blocklists-test .

      - name: Test blocklist failures with real services
        shell: bash
        run: |
          # systemd needs a writable private cgroup hierarchy in this disposable runner.
          docker run -d --name rpi-blocklists-test --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo rpi-blocklists-test
          cleanup() {
            test_exit_status=$?
            if [ "$test_exit_status" -ne 0 ]; then
              docker exec rpi-blocklists-test journalctl --no-pager -n 80 \
                -u ad-blocklists-update.service -u unbound.service || true
            fi
            docker rm -f rpi-blocklists-test >/dev/null
            exit "$test_exit_status"
          }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if docker exec rpi-blocklists-test systemctl show --property=Version --value >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec -e RPI_FIREWALL_DISPOSABLE_TEST=1 rpi-blocklists-test \
            python3 tests/integration_blocklist_orchestration.py

  lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install template test dependencies
        run: python3 -m pip install Jinja2 PyYAML dnspython

      - name: Test blocklists and network templates
        run: python3 -m unittest discover -s tests -v

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          args: "--profile=min"
          requirements_file: collections/requirements.yml

  dns-reliability:
    name: DNS resilience and IPv6 ACLs
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
      options: --cap-add=NET_ADMIN
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install DNS test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            unbound dnsutils iproute2 python3 python3-jinja2 python3-yaml openssl ca-certificates

      - name: Test DNS behavior in the isolated container
        run: python3 tests/integration_dns_reliability.py

  vpn-configuration:
    name: VPN configuration lifecycle
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
      options: --cap-add=NET_ADMIN --cap-add=NET_RAW --cap-add=NET_BROADCAST
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install VPN test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            systemd dbus ansible-core wireguard firewalld python3-netaddr iproute2 python3-jinja2 python3-yaml

      - name: Test enable, rename and disable with networkd
        shell: bash
        run: |
          mkdir -p /run/dbus /run/systemd/netif /etc/systemd/network /etc/systemd/networkd.conf.d /etc/firewalld/zones
          cp roles/firewall/files/networkd/20-router.conf /etc/systemd/networkd.conf.d/20-router.conf
          chown systemd-network:systemd-network /run/systemd/netif
          dbus-daemon --system --fork
          ip link add lan-test type dummy
          ip link set lan-test up
          setpriv --reuid systemd-network --regid systemd-network --init-groups \
            --inh-caps +net_admin,+net_raw,+net_bind_service \
            --ambient-caps +net_admin,+net_raw,+net_bind_service \
            /usr/lib/systemd/systemd-networkd >/tmp/networkd.log 2>&1 &
          networkd_test_pid=$!
          trap 'kill "$networkd_test_pid"' EXIT
          for attempt in {1..50}; do
            if busctl --system --no-pager status org.freedesktop.network1 >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          RPI_FIREWALL_DISPOSABLE_TEST=1 python3 tests/integration_vpn_configuration.py
