---
name: Ansible Lint

on: [pull_request]

permissions:
  contents: read

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install template test dependencies
        run: python3 -m pip install Jinja2 PyYAML

      - name: Test blocklists and network templates
        run: python3 -m unittest discover -s tests -v

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          args: "--profile=min"
          requirements_file: collections/requirements.yml
