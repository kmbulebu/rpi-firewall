[project]
name = "rpi-firewall"
version = "0.1.0"
description = "Ansible configuration for an Ubuntu router and firewall"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "ansible-core>=2.20,<2.23",
  "ansible-lint>=26.11,<27",
  "dnspython>=2.8,<3",
  "Jinja2>=3.1,<4",
  "netaddr>=1.3,<2",
  "PyYAML>=6,<7",
]

[tool.uv]
package = false
