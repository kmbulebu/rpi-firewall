server:
  verbosity: 1
  log-servfail: yes
  ip-freebind: yes
  ip-dscp: 46
{% set listener_ports = ['', '@853', '@443'] if dns_encrypted_listeners_enabled | bool else [''] %}
{% for iface in [lan_iface, lan_guests_iface] %}
{% for port in listener_ports %}
  interface: {{ iface }}{{ port }}
{% endfor %}
{% endfor %}
  # Permit clients with delegated global IPv6 sources on our LAN DNS listeners.
  # These select destination sockets, not ingress devices; firewalld gates ingress.
{% for iface in [lan_iface, lan_guests_iface] %}
{% for port in listener_ports %}
  interface-action: {{ iface }}{{ port }} allow
{% endfor %}
{% endfor %}
  prefer-ip6: yes
  access-control: {{ lan_cidr }} allow
  access-control: {{ lan_guests_cidr }} allow
  access-control: fe80::/10 allow
  access-control: fd00::/8 allow
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: fd00::/8
  private-address: fe80::/10
  private-address: 127.0.0.0/8
  private-address: ::ffff:0:0/96
{% for dns_private_domain in dns_private_domains %}
  private-domain: "{{ dns_private_domain }}"
{% endfor %}
  do-not-query-localhost: yes
  tls-upstream: yes
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
{% if dns_encrypted_listeners_enabled | bool %}
  tls-service-key: /etc/unbound/unbound_server.key
  tls-service-pem: /etc/unbound/unbound_server.pem
{% endif %}
  harden-glue: yes
  harden-dnssec-stripped: yes
  prefetch: yes
  serve-expired: {{ dns_serve_expired | bool | ternary('yes', 'no') }}
  serve-expired-ttl: {{ dns_serve_expired_ttl }}
  serve-expired-ttl-reset: no
  serve-expired-client-timeout: {{ dns_serve_expired_client_timeout }}
  serve-expired-reply-ttl: 30
  num-threads: 1
  local-zone: {{ domain }} static
  
{% for ptr_zone in ptr_zones %}
  local-zone: "{{ ptr_zone }}" static
{% endfor %}
  local-data: "{{ domain }} 10800 IN NS localhost."
  local-data: "{{ domain }} 10800 IN SOA localhost. nobody.invalid. 1 3600 1200 604800 10800"
{% for dhcp_reservation in (dhcp_reservations | default([], true))%}
  local-data: "{{ dhcp_reservation.hostname }}.{{ domain }} 60 IN A {{ dhcp_reservation.ip_address }}"
  local-data-ptr: "{{ dhcp_reservation.ip_address }} {{ dhcp_reservation.hostname }}.{{ domain.rstrip('.') }}."
{% endfor %}

forward-zone:
  name: .
  forward-tls-upstream: yes
{% for name_server in name_servers %}
  forward-addr: {{ name_server }}
{% endfor %}
