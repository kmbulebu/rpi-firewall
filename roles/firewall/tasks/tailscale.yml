---
- name: Get Ubuntu OS release name
  ansible.builtin.command:
    cmd: lsb_release -cs
  register: ubuntu_release_name
  changed_when: false
- name: Add Tailscale GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_release_name.stdout }}.noarmor.gpg"
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: '0644'
- name: Add Tailscale repository list
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_release_name.stdout }}.tailscale-keyring.list
    dest: /etc/apt/sources.list.d/tailscale.list
    mode: '0644'
# This vendor repository is outside our Ubuntu-only unattended-upgrade origins.
# Retain intentional upgrades here so Tailscale continues receiving updates.
- name: Install and update tailscale
  apt:
    update_cache: yes
    name: tailscale
    state: latest
    install_recommends: false
- name: Start tailscaled
  systemd:
    name: tailscaled.service
    enabled: yes
    state: started
    masked: no
- name: Update tailscaled configuration
  template:
    src: tailscale/defaults
    dest: /etc/default/tailscaled
    owner: root
    group: root
    mode: '0644'
  notify: restart tailscaled
- name: Check Tailscale authentication
  ansible.builtin.include_tasks: tailscale_auth.yml
- name: Tailscale Configure
  command:
    argv:
      - tailscale
      - set
      - --exit-node-allow-lan-access=false
      - --advertise-exit-node
      - --accept-routes=false
      - --accept-dns=false
