---
- name: Validate Ubuntu Pro services
  ansible.builtin.assert:
    that:
      - ubuntu_pro_services is sequence and ubuntu_pro_services is not string and ubuntu_pro_services is not mapping
    fail_msg: ubuntu_pro_services must be a list of service names.

- name: Validate Ubuntu Pro service names
  ansible.builtin.assert:
    that:
      - item is string and item is match('^[a-z][a-z0-9-]*$')
    fail_msg: Ubuntu Pro service names must contain only lowercase letters, digits and hyphens.
  loop: '{{ ubuntu_pro_services }}'

- name: Explain Ubuntu Pro check mode
  ansible.builtin.debug:
    msg: Ubuntu Pro inventory was validated; package, subscription and service operations are skipped in check mode.
  when: ansible_check_mode

- name: Configure optional Ubuntu Pro subscription
  when: not ansible_check_mode
  block:
    - name: Initialize Ubuntu Pro readiness
      ansible.builtin.set_fact:
        ubuntu_pro_ready: false

    - name: Inspect Ubuntu Pro client and subscription
      block:
        - name: Ensure Ubuntu Pro client is installed
          ansible.builtin.apt:
            name: ubuntu-pro-client
            state: present
            install_recommends: false

        - name: Read Ubuntu Pro subscription status
          ansible.builtin.command:
            argv: [timeout, --kill-after=10s, 30s, pro, status, --format, json]
          register: ubuntu_pro_status_result
          changed_when: false
          no_log: true

        - name: Parse Ubuntu Pro subscription status
          ansible.builtin.set_fact:
            ubuntu_pro_status: '{{ ubuntu_pro_status_result.stdout | from_json }}'
          no_log: true

        - name: Require recognizable Ubuntu Pro status
          ansible.builtin.assert:
            that:
              - ubuntu_pro_status.attached is boolean
              - ubuntu_pro_status.services is sequence and ubuntu_pro_status.services is not string and ubuntu_pro_status.services is not mapping
          no_log: true

        - name: Mark Ubuntu Pro client ready
          ansible.builtin.set_fact:
            ubuntu_pro_ready: true
      rescue:
        - name: Report unavailable Ubuntu Pro client or subscription status
          ansible.builtin.debug:
            msg: >-
              WARNING: Ubuntu Pro client setup or status check failed. Core router configuration
              was already applied. Subscription changes were skipped; retry on the next Ansible run.
              Inspect sudo pro status on the router.

    # Missing credentials are an inventory error, not a subscription outage.
    # Already attached machines need no inventory token and are never reattached.
    - name: Require a token for initial Ubuntu Pro attachment
      ansible.builtin.assert:
        that:
          - ubuntu_pro_token is defined and ubuntu_pro_token is string and ubuntu_pro_token | trim | length > 0
        fail_msg: Set ubuntu_pro_token in private inventory for the initial Ubuntu Pro attachment.
      when: ubuntu_pro_ready and not ubuntu_pro_status.attached
      no_log: true

    - name: Reconcile Ubuntu Pro attachment and requested services
      when: ubuntu_pro_ready
      block:
        - name: Attach an unattached machine without automatic service enablement
          when: not ubuntu_pro_status.attached
          block:
            - name: Allocate temporary Ubuntu Pro attachment file in memory
              ansible.builtin.tempfile:
                state: file
                path: /run
                prefix: rpi-ubuntu-pro-
                suffix: .yaml
              register: ubuntu_pro_attach_file
              changed_when: false
              no_log: true

            - name: Write protected Ubuntu Pro token
              ansible.builtin.copy:
                content: "{{ {'token': ubuntu_pro_token, 'enable_services': []} | to_nice_yaml }}"
                dest: '{{ ubuntu_pro_attach_file.path }}'
                owner: root
                group: root
                mode: '0600'
              changed_when: false
              no_log: true
              diff: false

            - name: Attach Ubuntu Pro subscription
              ansible.builtin.command:
                argv:
                  - timeout
                  - --kill-after=10s
                  - 120s
                  - pro
                  - attach
                  - --no-auto-enable
                  - --attach-config
                  - '{{ ubuntu_pro_attach_file.path }}'
              changed_when: true
              no_log: true
          always:
            - name: Remove temporary Ubuntu Pro token
              ansible.builtin.file:
                path: '{{ ubuntu_pro_attach_file.path }}'
                state: absent
              when: ubuntu_pro_attach_file.path is defined
              changed_when: false
              no_log: true

        - name: Read service status after Ubuntu Pro attachment
          ansible.builtin.command:
            argv: [timeout, --kill-after=10s, 30s, pro, status, --format, json]
          register: ubuntu_pro_attached_result
          changed_when: false
          no_log: true

        - name: Determine enabled Ubuntu Pro services
          ansible.builtin.set_fact:
            ubuntu_pro_attached: '{{ ubuntu_pro_attached_result.stdout | from_json }}'
          no_log: true

        - name: Verify Ubuntu Pro attachment before enabling services
          ansible.builtin.assert:
            that:
              - ubuntu_pro_attached.attached == true
              - ubuntu_pro_attached.services is sequence and ubuntu_pro_attached.services is not string and ubuntu_pro_attached.services is not mapping
          no_log: true

        - name: Enable requested Ubuntu Pro services that are not enabled
          ansible.builtin.command:
            argv: [timeout, --kill-after=10s, 300s, pro, enable, --assume-yes, '{{ item }}']
          loop: '{{ ubuntu_pro_services | unique }}'
          when: >-
            item not in (ubuntu_pro_attached.services | selectattr('status', 'equalto', 'enabled') |
            map(attribute='name') | list)
          changed_when: true
          no_log: true

        - name: Read final Ubuntu Pro status
          ansible.builtin.command:
            argv: [timeout, --kill-after=10s, 30s, pro, status, --format, json]
          register: ubuntu_pro_final_result
          changed_when: false
          no_log: true

        - name: Verify requested Ubuntu Pro services are enabled
          ansible.builtin.assert:
            that:
              - (ubuntu_pro_final_result.stdout | from_json).attached == true
              - >-
                ubuntu_pro_services | difference((ubuntu_pro_final_result.stdout | from_json).services |
                selectattr('status', 'equalto', 'enabled') | map(attribute='name') | list) | length == 0
          no_log: true
      rescue:
        - name: Report incomplete Ubuntu Pro configuration
          ansible.builtin.debug:
            msg: >-
              WARNING: Ubuntu Pro attachment or service configuration did not complete.
              Core router configuration was already applied. Some subscription changes may have
              succeeded; retry on the next Ansible run. Inspect sudo pro status on the router.
