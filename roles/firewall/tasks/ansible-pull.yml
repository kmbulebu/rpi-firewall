---
- name: Validate positive Ansible polling interval
  ansible.builtin.assert:
    that:
      - ansible_pull_timer_interval | string | regex_search('[1-9]') is not none
    fail_msg: Use a positive polling interval, or disable the timer with ansible_pull_timer_enabled.
  when: ansible_pull_timer_enabled | bool
- name: Parse Ansible polling interval before updating units
  ansible.builtin.command:
    argv:
      - systemd-analyze
      - timespan
      - '{{ ansible_pull_timer_interval }}'
  changed_when: false
  check_mode: false
  when: ansible_pull_timer_enabled | bool
- name: Setup ansible-pull config
  template:
    src: ansible-pull/ansible-pull
    dest: /etc/default/ansible-pull
    owner: root
    group: root
    mode: '0640'
- name: Setup ansible-pull service
  copy:
    src: ansible-pull/ansible-pull.service
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: '0644'
  notify: systemctl daemon-reload
- name: Setup ansible-pull-reconfigure service
  copy:
    src: ansible-pull/ansible-pull-reconfigure.service
    dest: /etc/systemd/system/ansible-pull-reconfigure.service
    owner: root
    group: root
    mode: '0644'
  notify: systemctl daemon-reload
- name: Setup ansible-pull timer
  template:
    src: ansible-pull/ansible-pull.timer
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: '0644'
  notify: systemctl daemon-reload
- name: Setup ansible-pull-reconfigure path watch
  template:
    src: ansible-pull/ansible-pull-reconfigure.path
    dest: /etc/systemd/system/ansible-pull-reconfigure.path
    owner: root
    group: root
    mode: '0644'
  notify: systemctl daemon-reload
- name: systemctl daemon-reload
  systemd:
    daemon_reload: yes
- name: Setup ansible-pull.service
  systemd:
    name: ansible-pull.service
    enabled: no # Do not run on boot, only on timer trigger.
    masked: no
- name: Configure ansible-pull.timer
  systemd:
    name: ansible-pull.timer
    enabled: '{{ ansible_pull_timer_enabled | bool }}'
    state: "{{ (ansible_pull_timer_enabled | bool) | ternary('started', 'stopped') }}"
    masked: no
- name: Setup ansible-pull-reconfigure.service
  systemd:
    name: ansible-pull-reconfigure.service
    enabled: no # Do not run on boot, only on path trigger.
    masked: no
- name: Enable ansible-pull-reconfigure.path
  systemd:
    name: ansible-pull-reconfigure.path
    enabled: yes
    state: started
    masked: no
