---
- include_tasks: validate_vpn.yml
- include_tasks: time.yml
- include_tasks: hostname.yml
- include_tasks: user.yml
- include_tasks: motd.yml
- include_tasks: mounts.yml
- include_tasks: rsyslog.yml
- include_tasks: apt.yml
- include_tasks: ansible-pull.yml
- include_tasks: tools.yml
- include_tasks: network.yml
- include_tasks: ethtool.yml
- include_tasks: dns.yml
- include_tasks: tailscale.yml
  when: tailscale_auth_key is defined
- include_tasks: firewalld.yml
- include_tasks: forwarding.yml
- include_tasks: wireguard_client.yml
- include_tasks: prometheus_node_exporter.yml
- include_tasks: rpi.yml
- include_tasks: apparmor.yml
- include_tasks: cleanup.yml
- include_tasks: watchdog.yml
- name: Apply core service changes before optional integrations
  ansible.builtin.meta: flush_handlers
- name: Configure optional Ubuntu Pro subscription
  ansible.builtin.include_tasks: ubuntu_pro.yml
  when: ubuntu_pro_token | default('', true) | string | trim | length > 0
- name: Configure DNS ad blocking
  ansible.builtin.include_tasks: ad_blocking.yml
- name: Configure optional WAG-D20 serial capture
  ansible.builtin.include_tasks: wag_d20_serial.yml
- meta: clear_facts
