---
- name: Validate DHCP lease durations
  assert:
    that:
      - lan_dhcp_lease_seconds | int > 0
      - lan_guests_dhcp_lease_seconds | int > 0
      - lan_vpn_dhcp_lease_seconds | int > 0
    fail_msg: DHCP lease durations must be positive numbers of seconds.
# Reject ambiguous matches before writing any network configuration.
- name: Validate backup WAN configuration
  assert:
    that:
      - wan_backup_iface_networkd_link_match | default('', true) | trim | length > 0
      - wan_iface_networkd_link_match | trim != 'Property=ID_BUS=usb'
      - wan_backup_iface_networkd_link_match | default('') | trim != wan_iface_networkd_link_match | trim
      - wan_backup_iface != wan_iface
      - wan_backup_iface != lan_iface
      - wan_backup_route_metric | int > 0
      - wan_backup_route_metric | int < wan_route_metric | int
    fail_msg: >-
      Backup WAN requires distinct device matchers and interface names, an explicit
      primary WAN matcher (not all USB devices), and a lower positive backup metric.
  when: wan_backup_enabled | bool
- name: Disable cloud-init network configuration
  copy:
    content: "network: {config: disabled}"
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
- name: Remove cloud-init netplan configuration
  file:
    path: /etc/netplan/50-cloud-init.yaml
    state: absent
  notify: netplan apply
## WAN Network
- name: Configure physical wan Link
  template:
    src: networkd/wan/00-wan.link
    dest: /etc/systemd/network/00-wan.link
    owner: root
    group: systemd-network
    mode: '0644'
  notify:
    - reload udev rules
    - restart systemd-networkd
- name: Configure wan network
  template:
    src: networkd/wan/10-wan.network
    dest: /etc/systemd/network/10-wan.network
    owner: root
    group: systemd-network
    mode: '0644'
  notify: restart systemd-networkd
## Optional hot-plug backup WAN
- name: Configure backup wan link and network
  template:
    src: "networkd/wan-backup/{{ item }}"
    dest: "/etc/systemd/network/{{ item }}"
    owner: root
    group: systemd-network
    mode: '0644'
  loop:
    - 00-wan-backup.link
    - 10-wan-backup.network
  when: wan_backup_enabled | bool
  notify:
    - reload udev rules
    - restart systemd-networkd
- name: Remove disabled backup wan configuration
  file:
    path: "/etc/systemd/network/{{ item }}"
    state: absent
  loop:
    - 00-wan-backup.link
    - 10-wan-backup.network
  when: not (wan_backup_enabled | bool)
  notify:
    - reload udev rules
    - restart systemd-networkd
## LAN Network
- name: Configure lan link
  template:
    src: networkd/lan/00-lan.link
    dest: /etc/systemd/network/00-lan.link
    owner: root
    group: systemd-network
    mode: '0644'
  notify: restart systemd-networkd
- name: Configure lan network
  template:
    src: networkd/lan/10-lan.network
    dest: /etc/systemd/network/10-lan.network
    owner: root
    group: systemd-network
    mode: '0644'
  notify: restart systemd-networkd
- name: Setup system DNS
  template:
    src: dns/resolv.conf
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
- name: Set network receive queue cpu assignment
  template:
    src: udev/zz-network-tunings.rules
    dest: /etc/udev/rules.d/zz-network-tunings.rules
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-networkd
## Guests VLAN Network
- name: Create lan guests netdev
  template:
    src: networkd/lan_guests/30-lan-guests.netdev
    dest: /etc/systemd/network/30-lan-guests.netdev
    owner: root
    group: systemd-network
    mode: '0644'
  notify: restart systemd-networkd
- name: Configure lan guests network
  template:
    src: networkd/lan_guests/30-lan-guests.network
    dest: /etc/systemd/network/30-lan-guests.network
    owner: root
    group: systemd-network
    mode: '0644'
  notify: restart systemd-networkd
