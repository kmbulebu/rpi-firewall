---
- name: Validate stale DNS response limits
  assert:
    that:
      - dns_serve_expired_ttl | int > 0
      - dns_serve_expired_client_timeout | int > 0
    fail_msg: Stale DNS responses require a positive age limit and upstream wait time.
- name: Install DNS services and packaged root trust anchors
  ansible.builtin.apt:
    name:
      - systemd-resolved
      - unbound
      - dns-root-data
    state: present
    install_recommends: false
# Note: systemd-networkd is adding support for DNS resolution through resolved of DHCP server leases in v259.
# https://github.com/systemd/systemd/commit/a7fa29b1b52210e33f4e43efc1a2f06b7c7233c0
- name: Compute PTR /24 zones for LAN (set ptr_zones)
  set_fact:
    base_ip: "{{ (lan_network | default(router_ip_address | ansible.utils.ipaddr('network'))).split('/')[0] }}"
    prefix: "{{ (lan_cidr | default(router_ip_address | ansible.utils.ipaddr('network/prefix'))).split('/')[-1] | int }}"
- name: Build single PTR zone when prefix >= 24
  set_fact:
    ptr_zones: "{{ [ (base_ip.split('.')[2] ~ '.' ~ base_ip.split('.')[1] ~ '.' ~ base_ip.split('.')[0] ~ '.in-addr.arpa.') ] }}"
  when: prefix | int >= 24
- name: Build multiple PTR zones when prefix < 24
  set_fact:
    ptr_zones: "{{ ptr_zones | default([]) + [ ( (base_ip.split('.')[2] | int + item) | string ) ~ '.' ~ base_ip.split('.')[1] ~ '.' ~ base_ip.split('.')[0] ~ '.in-addr.arpa.' ] }}"
  loop: "{{ range(0, (2 ** (24 - (prefix | int))) ) | list }}"
  when: prefix | int < 24
- name: Configure systemd-resolved
  template:
    src: resolved/resolved.conf
    dest: /etc/systemd/resolved.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart systemd-resolved
- name: Enable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: yes
    state: started
    masked: no
- name: Wait for the resolved stub configuration
  ansible.builtin.wait_for:
    path: /run/systemd/resolve/stub-resolv.conf
    timeout: 10
- name: Use the systemd-resolved stub resolver
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
# We don't need or want unbound to perform local resolution.
# systemd-resolved is fine for that.
- name: Disable and mask unbound-resolvconf.service
  systemd:
    name: unbound-resolvconf.service
    enabled: no
    state: stopped
    masked: yes
# Seed once without network access. Unbound tracks RFC 5011 updates itself;
# Ubuntu's service helper also refreshes from newer dns-root-data at startup.
- name: Seed a missing Unbound root trust anchor
  ansible.builtin.copy:
    src: /usr/share/dns/root.key
    dest: /var/lib/unbound/root.key
    remote_src: true
    force: false
    owner: unbound
    group: unbound
    mode: '0644'
  notify: restart unbound
- name: Template a file to /etc/unbound/unbound.conf.d/server.conf
  template:
    src: unbound/server.conf
    dest: /etc/unbound/unbound.conf.d/server.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart unbound
- name: Create systemd unbound.service.d overrides directory
  file:
    path: /etc/systemd/system/unbound.service.d/
    state: directory
    mode: '0755'
- name: Override systemd unbound settings
  copy:
    src: unbound/10-priority.conf
    dest: /etc/systemd/system/unbound.service.d/10-priority.conf
    owner: root
    group: root
    mode: '0644'
  notify: 
    - systemctl daemon-reload
    - restart unbound 
- name: Enable unbound
  systemd:
    name: unbound
    enabled: yes
    state: started
    masked: no
