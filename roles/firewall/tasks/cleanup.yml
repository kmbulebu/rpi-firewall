# Disable services we don't need. 

# Remove packages we don't need.
- name: Apt Unused Packages
  apt:
    name:
      - snapd
      - multipath-tools
      - popularity-contest
      - byobu
      - packagekit
      - cloud-init # No longer needed after first boot
      - plymouth # Boot screen service
      - plymouth-theme-ubuntu-text
      - apport # Crash report tool
      - lxd-agent-loader 
      - modemmanager
      - sosreport
      - motd-news-config # Disabled motd-news
    state: absent
    purge: yes
    autoclean: yes
    autoremove: yes
# A generic host may depend on these for its disks and firmware updates.
- name: Remove filesystem tools only for the managed Pi layout
  ansible.builtin.apt:
    name: [lvm2, udisks2]
    state: absent
    purge: true
  when: manage_fstab | bool
- name: Remove firmware updater on the managed Pi platform
  ansible.builtin.apt:
    name: fwupd
    state: absent
    purge: true
  when: rpi_tuning_enabled | bool
